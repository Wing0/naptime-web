name = "naptime-experiments"
account_id = "2e1b26a7137fe907288ca360f1744d0d"
main = "src/index.js"
compatibility_date = "2026-06-27"

# Deploy from this directory or pass:
# npm exec wrangler -- deploy --config cloudflare/worker/wrangler.toml

[[analytics_engine_datasets]]
binding = "LANDING_ANALYTICS"
dataset = "naptime_landing_events"

[[routes]]
pattern = "naptime.info/free.html*"
zone_name = "naptime.info"

[[routes]]
pattern = "www.naptime.info/free.html*"
zone_name = "naptime.info"
[[routes]]
pattern = "naptime.info/android*"
zone_name = "naptime.info"

[[routes]]
pattern = "www.naptime.info/android*"
zone_name = "naptime.info"

[[routes]]
pattern = "naptime.info/__nt_event*"
zone_name = "naptime.info"

[[routes]]
pattern = "www.naptime.info/__nt_event*"
zone_name = "naptime.info"

